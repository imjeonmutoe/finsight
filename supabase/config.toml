# 로컬 `supabase start`와 CLI가 읽는 설정이다. 원격(스테이징·프로덕션)에는 자동 적용되지 않으며,
# 스테이징 Auth는 대시보드에서 아래 값과 같게 맞춘다(ADR-019). 시드([db.seed])는 스테이징 초기화
# 워크플로우의 `supabase db reset`도 읽는다.
# 비밀값을 평문으로 적지 마라. 커밋된다. 필요하면 env(...) 참조를 쓴다.

project_id = "finsight"

# 원격과 같은 major여야 로컬이 프로덕션과 같은 Postgres에서 마이그레이션을 돌린다 (show server_version → 17.6)
[db]
major_version = 17

# DB를 초기화할 때 테스트 사용자를 넣는다(로컬·스테이징). seed.sql은 buildSeedSql()이 만든다
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

# site_url은 Vercel 프로덕션 도메인, 리다이렉트는 프로덕션 콜백과 팀 슬러그 기준 프리뷰 와일드카드다.
# enable_signup = false가 GoTrue의 가입 차단(DISABLE_SIGNUP)이다. 시드가 SQL로 만든 사용자는 영향받지 않는다
[auth]
enabled = true
site_url = "https://finsight-zeta-peach.vercel.app"
additional_redirect_urls = [
  "https://finsight-zeta-peach.vercel.app/auth/callback",
  "https://*-jpjeon87-9303s-projects.vercel.app/**",
]
enable_signup = false
enable_anonymous_sign_ins = false

# 이 섹션의 enable_signup은 이름과 달리 이메일 공급자 자체를 켠다(EXTERNAL_EMAIL_ENABLED). false면 비밀번호 로그인도 막힌다.
# 프리뷰 로그인이 비밀번호 방식이라 켜 두고, 시드 사용자는 확인된 상태로 만들므로 이메일 확인을 끈다
[auth.email]
enable_signup = true
enable_confirmations = false
