<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinSight — 지출 대시보드</title>
<link rel="stylesheet" href="tokens/fonts.css">
<link rel="stylesheet" href="tokens/colors.css">
<link rel="stylesheet" href="tokens/typography.css">
<link rel="stylesheet" href="tokens/spacing.css">
<link rel="stylesheet" href="tokens/radius.css">
<link rel="stylesheet" href="tokens/elevation.css">
<link rel="stylesheet" href="tokens/base.css">
<style>
html[data-theme="dark"]{--color-canvas:#0a0b0d;--color-surface-soft:#101215;--color-surface-strong:#16181c;--color-ink:#ffffff;--color-body:#a8acb3;--color-body-strong:#ffffff;--color-muted:#7c828a;--color-muted-soft:#5b616e;--color-hairline:rgba(255,255,255,0.08);--color-hairline-soft:rgba(255,255,255,0.06);--color-primary:#4d84ff;--color-primary-active:#0052ff;--color-semantic-up:#2ed08c;--color-semantic-down:#ff6b76}
body{background:var(--color-canvas);color:var(--color-body);word-break:keep-all}
a:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--color-primary);outline-offset:2px}
.num{font-family:var(--font-mono);font-weight:var(--font-weight-medium);font-variant-numeric:tabular-nums;color:var(--color-ink);white-space:nowrap}
.ink{color:var(--color-ink)}
.muted{color:var(--color-muted)}
.lbl{font-size:var(--type-caption-strong-size);letter-spacing:.04em;text-transform:uppercase;font-weight:var(--font-weight-semibold);color:var(--color-muted);margin:0}
.figure{font-family:var(--font-mono);font-weight:var(--font-weight-medium);font-variant-numeric:tabular-nums;font-size:36px;letter-spacing:-.5px;color:var(--color-ink);margin-top:var(--space-sm);white-space:nowrap}
.h-sec{font-size:var(--type-display-sm-size);line-height:var(--type-display-sm-lh);letter-spacing:var(--type-display-sm-ls);font-weight:var(--font-weight-regular)}

.app-nav{height:var(--nav-height);border-bottom:1px solid var(--color-hairline);background:var(--color-canvas);position:sticky;top:0;z-index:10}
.nav-inner{max-width:var(--container-max);margin:0 auto;height:100%;padding:0 var(--space-lg);display:flex;align-items:center;gap:var(--space-xl)}
.brand{font-family:var(--font-display);font-size:22px;font-weight:var(--font-weight-semibold);letter-spacing:-.5px;color:var(--color-primary)}
.app-nav nav{display:flex;gap:var(--space-lg);flex:1;flex-wrap:wrap}
.app-nav nav button{background:none;border:0;padding:0;cursor:pointer;font:var(--font-weight-medium) var(--type-nav-link-size)/var(--type-nav-link-lh) var(--font-sans);color:var(--color-ink)}
.app-nav nav button.on{color:var(--color-primary)}
.nav-right{display:flex;align-items:center;gap:var(--space-sm)}
.theme{height:36px;padding:0 14px;border-radius:var(--radius-pill);border:1px solid var(--color-hairline);background:transparent;color:var(--color-ink);font:var(--font-weight-medium) 13px var(--font-sans);cursor:pointer}

main{max-width:var(--container-max);margin:0 auto;padding:var(--space-xxl) var(--space-lg) var(--space-section)}
.stack{display:flex;flex-direction:column;gap:var(--space-lg)}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--space-base);flex-wrap:wrap;margin-bottom:var(--space-xs)}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:var(--space-lg)}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:var(--space-lg);align-items:start}
.card{background:var(--color-canvas);border:1px solid var(--color-hairline);border-radius:var(--radius-xl);padding:var(--space-xl)}
html[data-theme="dark"] .card{background:var(--color-surface-strong)}

.bars{display:flex;flex-direction:column;gap:var(--space-sm);margin-top:var(--space-md)}
.bar-row{display:grid;grid-template-columns:88px 1fr auto;align-items:center;gap:var(--space-sm);font-size:14px}
.bar-name{color:var(--color-ink);font-size:14px}
.bar-track{height:8px;border-radius:var(--radius-pill);background:var(--color-surface-strong);overflow:hidden}
.bar-fill{display:block;height:100%;background:var(--color-ink);border-radius:var(--radius-pill)}
html[data-theme="dark"] .bar-track{background:rgba(255,255,255,.08)}

.summary{list-style:none;margin:var(--space-md) 0 0;padding:0;display:flex;flex-direction:column;gap:var(--space-base)}
.summary li{padding-left:var(--space-base);border-left:1px solid var(--color-hairline)}
.summary p{color:var(--color-body-strong);font-size:15px;line-height:1.55;text-wrap:pretty}
.ev{background:none;border:0;padding:0;margin-top:6px;cursor:pointer;color:var(--color-primary);font:var(--font-weight-medium) 13px var(--font-sans)}
.ev:hover{text-decoration:underline}

.list{list-style:none;margin:var(--space-md) 0 0;padding:0}
.list li{display:flex;justify-content:space-between;align-items:center;gap:var(--space-base);padding:var(--space-sm) 0;border-top:1px solid var(--color-hairline-soft)}
.list li p{margin:0}
.plain{margin:var(--space-base) 0 0;padding-left:1.1em;color:var(--color-body)}
.plain li{margin-bottom:6px;font-size:15px}

table.tx{width:100%;border-collapse:collapse;font-size:14px}
table.tx th{text-align:left;font-size:var(--type-caption-strong-size);letter-spacing:.04em;text-transform:uppercase;color:var(--color-muted);font-weight:var(--font-weight-semibold);padding:var(--space-base) var(--space-md);border-bottom:1px solid var(--color-hairline);white-space:nowrap}
table.tx td{padding:10px var(--space-md);border-bottom:1px solid var(--color-hairline-soft);vertical-align:middle}
table.tx tr:last-child td{border-bottom:0}
table.tx tr.hi td{background:var(--color-surface-soft)}
.type{font-size:12px;font-weight:var(--font-weight-semibold);letter-spacing:.03em;color:var(--color-muted)}
.type.t-expense{color:var(--color-ink)}
select{appearance:none;border:1px solid var(--color-hairline);background:var(--color-canvas);color:var(--color-ink);border-radius:var(--radius-md);padding:8px 12px;font:var(--font-weight-medium) 14px var(--font-sans);cursor:pointer}
select:disabled{color:var(--color-muted-soft);cursor:not-allowed}
html[data-theme="dark"] select{background:var(--color-surface-dark-elevated)}

.seg{display:flex;gap:4px;padding:4px;border:1px solid var(--color-hairline);border-radius:var(--radius-pill)}
.seg button{border:0;background:none;padding:6px 14px;border-radius:var(--radius-pill);cursor:pointer;font:var(--font-weight-medium) 13px var(--font-sans);color:var(--color-muted);white-space:nowrap}
.seg{flex-shrink:0}
.list li>div:last-child{flex-shrink:0}
.seg button.on{background:var(--color-surface-strong);color:var(--color-ink)}
html[data-theme="dark"] .seg button.on{background:rgba(255,255,255,.1)}

.steps{display:flex;gap:var(--space-base);align-items:center;font-size:13px;color:var(--color-muted-soft);flex-wrap:wrap}
.steps span.on{color:var(--color-ink)}
.steps span.done{color:var(--color-muted)}
.drop{margin-top:var(--space-lg);border:1px dashed var(--color-hairline);border-radius:var(--radius-xl);padding:var(--space-xxl) var(--space-lg);text-align:center;background:var(--color-surface-soft)}
html[data-theme="dark"] .drop{background:rgba(255,255,255,.03)}
.chart{display:flex;align-items:flex-end;gap:var(--space-lg);margin-top:var(--space-md);min-height:240px}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:var(--space-xs);justify-content:flex-end}
.chart-bar{width:100%;max-width:72px;border-radius:var(--radius-md) var(--radius-md) 0 0;background:var(--color-surface-strong)}
html[data-theme="dark"] .chart-bar{background:rgba(255,255,255,.14)}
.chart-bar.now,html[data-theme="dark"] .chart-bar.now{background:var(--color-ink)}
.toast{position:fixed;left:50%;bottom:var(--space-lg);transform:translateX(-50%);background:var(--color-surface-dark);color:var(--color-on-dark);padding:14px var(--space-md);border-radius:var(--radius-pill);font-size:14px;box-shadow:var(--elevation-card-hover,0 4px 12px rgba(0,0,0,.04));z-index:20}
html[data-theme="dark"] .toast{background:var(--color-surface-strong);border:1px solid var(--color-hairline)}
@media(max-width:720px){.h-sec{font-size:28px}.figure{font-size:28px}.nav-inner{gap:var(--space-base)}}

.mkt-nav{height:var(--nav-height)}
.mkt-nav nav{display:flex;gap:var(--space-lg);flex:1;flex-wrap:wrap}
.mkt-nav nav a{font-size:var(--type-nav-link-size);font-weight:var(--font-weight-medium);text-decoration:none}
.mkt-nav nav a:hover{text-decoration:underline}
.signin{font-size:var(--type-nav-link-size);font-weight:var(--font-weight-medium);text-decoration:none}
.band{padding:var(--space-section) var(--space-lg);background:var(--color-canvas)}
.band.soft{background:var(--color-surface-soft)}
.band-inner{max-width:var(--container-max);margin:0 auto}
.band-inner.narrow{max-width:720px}
.band-h{font-size:var(--type-display-md-size);line-height:var(--type-display-md-lh);letter-spacing:var(--type-display-md-ls);font-weight:var(--font-weight-regular)}
.landing h1{text-wrap:balance}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:var(--space-xxl) var(--space-lg);background:var(--color-surface-soft)}
.auth-card{width:100%;max-width:440px;background:var(--color-canvas);border:1px solid var(--color-hairline);border-radius:var(--radius-xl);padding:var(--space-xl)}
.auth-h{font-size:var(--type-title-lg-size);line-height:var(--type-title-lg-lh);letter-spacing:var(--type-title-lg-ls);margin:var(--space-base) 0 6px}
.line{display:flex;justify-content:space-between;align-items:baseline;padding:var(--space-sm) 0;border-bottom:1px solid var(--color-hairline-soft);font-size:15px}
.line.total{border-bottom:0;border-top:1px solid var(--color-hairline);margin-top:4px}
@media(max-width:900px){.mkt-nav nav{display:none}}
@media(max-width:720px){.band{padding:var(--space-xxl) var(--space-lg)}.band-h{font-size:28px}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds_bundle.js"></script>
<script src="finsight-data.js"></script>
<script type="text/babel" src="finsight-flow.jsx"></script>
<script type="text/babel" src="finsight-app.jsx"></script>
</body>
</html>
