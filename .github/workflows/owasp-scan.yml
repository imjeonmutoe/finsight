name: OWASP 정기 스캔

# `/owasp-scan`을 격주로 그대로 돌린다. 스킬 로직을 CI용으로 한 벌 더 두지 않는다
# (`.claude/skills/owasp-scan/`, `.claude/agents/owasp-auditor.md`).
#
# **이 리포는 공개다.** Actions 로그·아티팩트·Job Summary는 누구나 본다. 그래서
#   - 공개(Job Summary): 총점·등급·카테고리별 점수만
#   - 비공개(Slack 웹훅): critical·major 지적의 file:line·제목
#   - `.owasp/`는 아티팩트로 올리지 않는다. 러너와 함께 사라진다.

on:
  # cron은 UTC다. 금 09:00 UTC = 금 18:00 KST. cron으로는 "격주"를 못 쓰므로 매주 띄우고
  # check 잡이 홀수 주를 걸러낸다.
  schedule:
    - cron: "0 9 * * 5"
  # 수동 실행은 주 판정 없이 바로 돈다.
  workflow_dispatch:

concurrency:
  group: owasp-scan
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      due: ${{ steps.due.outputs.due }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .claude/skills/owasp-scan/scripts
      # 기준일(금요일)로부터 짝수 주에만 돈다. 기준일을 바꾸면 격주 위상이 바뀐다.
      - name: 이번 주가 스캔 주인지 판정
        id: due
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "due=$(python3 .claude/skills/owasp-scan/scripts/notify.py due --anchor 2026-10-02)" >> "$GITHUB_OUTPUT"
          fi

  scan:
    needs: check
    if: needs.check.outputs.due == 'true'
    runs-on: ubuntu-latest
    # 감사자 3개 + 반박 검증이 돈다. 리뷰 워크플로우(30분)보다 넉넉히.
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # claude-code-action의 GitHub App 인증에 필요하다

    steps:
      - uses: actions/checkout@v6

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # review-code.yml과 같은 이유로 App 토큰 교환을 건너뛴다. 이 잡은 contents:read뿐이다.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # 둘 다 기본값이 false지만 명시한다. 켜는 순간 지적 전문이 공개 로그·Summary에 찍힌다.
          show_full_output: "false"
          display_report: "false"
          prompt: |
            /owasp-scan

            비대화형 CI 실행이다. 물어볼 사람이 없다.
            - 감사자·검증자 **완료 알림을 기다렸다가 4단계(report.py)까지 끝내라.** 띄워 놓고 턴을
              끝내면 그 턴이 세션의 마지막이라 리포트가 안 만들어진다.
            - 5단계 화면 확인은 러너의 `google-chrome --headless=new`로 한다 (macOS 경로 대신).
            - 리포트·JSON을 커밋하거나 `.owasp/` 밖으로 옮기지 마라. 코드를 고치지 마라.
          # allowedTools는 보안 경계가 아니다. 감사자의 실제 권한은 에이전트 정의의 tools가 건다.
          # SLACK_WEBHOOK_URL은 이 스텝에 주지 않는다 — 에이전트는 리포 코드(신뢰할 수 없는 입력)를 읽는다.
          claude_args: |
            --allowedTools "Bash,Read,Write,Grep,Glob,Agent,SendMessage"
            --max-turns 60

      # 액션이 초록불이어도 리포트가 없을 수 있다(띄워 놓고 턴을 끝낸 경우). 점수 없는 초록불을 막는다.
      - name: 리포트가 만들어졌는지 확인
        run: |
          test -s .owasp/owasp-score.json || { echo "::error::.owasp/owasp-score.json이 없습니다."; exit 1; }

      - name: 공개 요약 (점수만)
        run: python3 .claude/skills/owasp-scan/scripts/notify.py summary .owasp/owasp-score.json >> "$GITHUB_STEP_SUMMARY"

      - name: Slack으로 상세 전송
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [ -n "$SLACK_WEBHOOK_URL" ] || { echo "::error::SLACK_WEBHOOK_URL 시크릿이 없습니다."; exit 1; }
          python3 .claude/skills/owasp-scan/scripts/notify.py slack .owasp/owasp-score.json --run-url "$RUN_URL" > slack.json
          curl -fsS -X POST -H "Content-Type: application/json" --data @slack.json "$SLACK_WEBHOOK_URL" > /dev/null

      # 스캔이 조용히 멈춰 몇 달째 아무 연락이 없는 상태를 막는다. 실행 링크만 보낸다.
      - name: 실패 알림
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$SLACK_WEBHOOK_URL" ] || exit 0
          python3 .claude/skills/owasp-scan/scripts/notify.py failure --run-url "$RUN_URL" \
            | curl -fsS -X POST -H "Content-Type: application/json" --data @- "$SLACK_WEBHOOK_URL" > /dev/null
