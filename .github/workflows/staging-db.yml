name: 스테이징 DB 초기화

# 프리뷰용 Supabase 프로젝트 `finsight-staging`을 초기화 → 마이그레이션 → 시드 순서로 다시 만든다.
# Branching(Pro)을 쓰지 않기로 해서, Vercel Preview는 언제나 이 스테이징 하나를 가리킨다.
#
# **이 워크플로우는 프로덕션에 절대 붙지 않는다.** 프로덕션 마이그레이션은 사람이 CLI·대시보드로 적용한다.
#   - 시크릿은 스테이징 접속 문자열 `STAGING_DB_URL` 하나뿐이다. Supabase 개인 액세스 토큰은 두지 않는다 —
#     계정의 모든 프로젝트(실데이터가 든 프로덕션 포함)를 다룰 수 있어, PR 코드가 도는 잡에 두면 손이 닿는다.
#     같은 이유로 프로젝트 연결(link)도 쓰지 않는다.
#   - `db reset`은 대상 DB를 통째로 지운다. 시크릿을 잘못 넣는 실수는 아래 가드 스텝 하나가 잡는다.
#
# `STAGING_DB_URL`은 **Session pooler** 주소여야 한다(대시보드 → Connect → Session pooler, 5432 포트).
# Free 플랜의 Direct 연결은 IPv6 전용인데 GitHub 러너는 IPv6로 나가지 못해 접속이 실패한다.
# 비밀번호에 특수문자가 있으면 퍼센트 인코딩해 넣는다(CLI 요구).

on:
  pull_request:
    paths: ["supabase/**"]
  # main에 머지된 상태로 스테이징을 되돌린다. PR이 남긴 스키마가 다음 PR까지 남지 않게 한다.
  push:
    branches: [main]
    paths: ["supabase/**"]
  workflow_dispatch: {}

permissions:
  contents: read

# 스테이징은 하나다. 두 실행이 동시에 초기화하면 서로의 마이그레이션이 섞인다.
# 취소도 하지 않는다 — 초기화 도중 끊기면 스테이징이 반쯤 지워진 채로 남는다.
concurrency:
  group: staging-db
  cancel-in-progress: false

jobs:
  # 액션은 커밋 SHA로 고정한다(review-code.yml과 같은 이유). 태그는 옮길 수 있어, 액션 저장소가
  # 탈취되면 같은 태그로 악성 코드가 DB 접속 문자열을 쥔 잡에서 돈다. 올릴 때는 태그가 가리키는
  # 커밋을 확인해 SHA와 주석을 함께 바꾼다.
  reset:
    # fork PR에는 GitHub이 시크릿을 주지 않아 가드에서 반드시 실패한다. 빨간불만 남기느니 돌지 않게 한다.
    # push·수동 실행은 fork 조건과 무관하게 돈다.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # 버전을 정확한 값으로 고정한다. latest면 CLI가 바뀌는 날 초기화 동작도 조용히 바뀐다.
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0

      # 시크릿을 잘못 넣으면 다음 스텝이 실데이터를 지운다. 이 가드가 그 실수를 잡는 유일한 장치다 —
      # 지우거나 초기화 뒤로 옮기지 마라. 실패 메시지에 URL을 찍지 않는다(비밀번호가 들어 있다).
      - name: 프로덕션 접속 가드
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          if [ -z "$STAGING_DB_URL" ]; then
            echo "::error::STAGING_DB_URL 시크릿이 비어 있습니다."
            exit 1
          fi
          case "$STAGING_DB_URL" in
            *qqhffvdkgnmtusvfizhx*)
              echo "::error::STAGING_DB_URL이 프로덕션 프로젝트를 가리킵니다. 초기화하지 않습니다."
              exit 1
              ;;
          esac

      # 원격 `db reset`은 storage 스키마를 지우지 않는다. 그대로 두면 두 번째 초기화부터 init 마이그레이션의
      # statements 버킷 insert가 23505로 실패한다. 마이그레이션이 storage에 만든 것만 지운다.
      # storage.allow_delete_query: Supabase가 storage 테이블 직접 DELETE를 막는 트리거의 해제 스위치(이 트랜잭션만).
      - name: 스테이징 storage 비우기
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          psql "$STAGING_DB_URL" -v ON_ERROR_STOP=1 -q <<'SQL'
          begin;
          set local storage.allow_delete_query = 'true';
          drop policy if exists statements_own on storage.objects;
          delete from storage.objects where bucket_id = 'statements';
          delete from storage.buckets where id = 'statements';
          commit;
          SQL

      # 마이그레이션 전부를 처음부터 적용하고 [db.seed]의 seed.sql까지 넣는다(--no-seed를 주지 않으면
      # --db-url에서도 시드가 돈다 — 2.120.0 `db reset --help`로 확인). --yes는 원격 초기화 확인 프롬프트용.
      - name: 스테이징 초기화 · 마이그레이션 · 시드
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: supabase db reset --db-url "$STAGING_DB_URL" --yes

      # 어떤 커밋의 마이그레이션이 스테이징에 올라갔는지 남긴다. 접속 정보는 쓰지 않는다.
      - name: 결과 요약
        run: |
          {
            echo "### 스테이징 DB를 다시 만들었습니다"
            echo ""
            echo "- 커밋: \`$GITHUB_SHA\`"
            echo "- 마이그레이션: $(ls supabase/migrations/*.sql | wc -l | tr -d ' ')개"
            echo "- 마지막 마이그레이션: \`$(ls supabase/migrations/*.sql | tail -n 1 | xargs basename)\`"
          } >> "$GITHUB_STEP_SUMMARY"
